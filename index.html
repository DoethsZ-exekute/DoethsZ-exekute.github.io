<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.exe | Portail Officiel</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: rgba(15, 15, 15, 0.85);
            --text-color: #f1f1f1;
            --accent-color: #00d2ff; /* Bleu néon électrique */
            --border-color: #222222;
            --hover-border: #00d2ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            /* Utilisation de l'image de fond */
            background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.85)), url('fud en contexte background image.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(4px);
        }

        /* En-tête : Bannière et Logo */
        .banner {
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .logo-exe {
            width: 80%;
            max-width: 320px;
            height: auto;
            margin: 10px auto 25px auto;
            display: block;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.2));
        }

        .bio {
            color: #aaa;
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        /* Section des Liens */
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-link {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #111111;
            color: var(--text-color);
            padding: 16px 20px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .btn-link:hover {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--hover-border);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
            transform: translateY(-2px);
        }

        footer {
            margin-top: 35px;
            font-size: 0.8rem;
            color: #666;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Bannière principale -->
        <img src="nouvelle banniere to upload.jpg" alt="Bannière .exe" class="banner">

        <!-- Lettrage Logo -->
        <img src="lettrages exe spikes.jpg" alt=".exe Spikes Logo" class="logo-exe">

        <p class="bio">Musique &bull; Logiciels &bull; Projets Visuels</p>

        <!-- Ensemble de vos plateformes -->
        <div class="links">
            <a href="https://exekute.bandcamp.com" class="btn-link" target="_blank" rel="noopener">
                Boutique Musique &bull; Bandcamp
            </a>

            <a href="https://exekute.printerval.com" class="btn-link" target="_blank" rel="noopener">
                Marchandise Fud & Lettrages &bull; Printerval
            </a>

            <a href="https://elasticstage.com/exe" class="btn-link" target="_blank" rel="noopener">
                Disques Vinyles Press On Demand &bull; ElasticStage
            </a>

            <a href="https://exekute.itch.io" class="btn-link" target="_blank" rel="noopener">
                Programmes & Logiciels &bull; Itch.io
            </a>

            <a href="https://n1m.com/3x3" class="btn-link" target="_blank" rel="noopener">
                Discographie Officielle &bull; N1M
            </a>
        </div>

        <footer>
            &copy; 2026 .exe — Tous droits réservés
        </footer>
    </div>

</body>
</html>
