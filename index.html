<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ocs-site-verification" content="0bb51c8a70501a4918b60b37d33ec1fa" />
    <title>.exe // Official Portal</title>
    <style>
        :root {
            --bg-color: #050505;
            --neon-cyan: #00f0ff;
            --neon-magenta: #ff007f;
            --neon-lava: #ffaa00;
            --text-main: #f0f0f0;
            --card-bg: rgba(12, 12, 12, 0.9);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        /* Grille cyberpunk de fond */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 0, 127, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
        }

        .container {
            text-align: center;
            max-width: 460px;
            width: 90%;
            padding: 25px;
            background: var(--card-bg);
            border: 1px solid #222;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
            backdrop-filter: blur(8px);
            border-radius: 8px;
            margin: 20px 0;
        }

        /* Fud en entête */
        .fud-header {
            width: 100%;
            max-height: 240px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            margin-bottom: 15px;
        }

        h1 {
            font-size: 2.2rem;
            margin: 5px 0;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
            letter-spacing: 2px;
        }

        .subtitle {
            color: var(--neon-lava);
            font-size: 0.85rem;
            margin-bottom: 25px;
            text-shadow: 0 0 8px rgba(255, 170, 0, 0.4);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #0d0d0d;
            color: var(--text-main);
            border: 1px solid #333;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .btn span.category {
            font-size: 0.65rem;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
        }

        .btn span.name {
            font-size: 1.05rem;
            font-weight: bold;
        }

        .btn:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            color: var(--neon-cyan);
        }

        .btn:hover span.category {
            color: var(--neon-magenta);
        }

        /* Section Signature / Logo .exe */
        .signature-section {
            margin-top: 30px;
            border-top: 1px dashed #333;
            padding-top: 20px;
        }

        .signature-title {
            font-size: 0.75rem;
            color: #888;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .signature-logo {
            width: 85%;
            max-width: 280px;
            border-radius: 4px;
            border: 1px solid var(--neon-magenta);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
            transition: transform 0.3s ease;
        }

        .signature-logo:hover {
            transform: scale(1.03);
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.6);
        }

        footer {
            margin-top: 20px;
            font-size: 0.7rem;
            color: #444;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Fud en vedette dans l'entête -->
        <img src="fud.jpg" alt="Fud" class="fud-header">

        <h1>.exe</h1>
        <div class="subtitle">Cyberpunk // Audio // Visual Universe</div>

        <div class="links-wrapper">
            <a class="btn" href="https://exekute.bandcamp.com" target="_blank">
                <span class="category">[ Digital Music Store ]</span>
                <span class="name">Bandcamp</span>
            </a>

            <a class="btn" href="https://elasticstage.com/exe" target="_blank">
                <span class="category">[ Vinyls & Print on Demand ]</span>
                <span class="name">ElasticStage</span>
            </a>

            <a class="btn" href="https://exekute.itch.io" target="_blank">
                <span class="category">[ Softwares & Tools ]</span>
                <span class="name">Itch.io</span>
            </a>

            <a class="btn" href="https://exekute.printerval.com" target="_blank">
                <span class="category">[ Merchandising & Fud ]</span>
                <span class="name">Printerval</span>
            </a>

            <a class="btn" href="https://n1m.com/3x3" target="_blank">
                <span class="category">[ Artist Profile ]</span>
                <span class="name">N1M</span>
            </a>
        </div>

        <!-- Signature artistique / Logo .exe -->
        <div class="signature-section">
            <div class="signature-title">// Signed Artwork //</div>
            <img src="logo-exe.jpg" alt=".exe Spiked Logo Signature" class="signature-logo">
        </div>

        <footer>SYSTEM ACTIVE // DOETHSZ-EXEKUTE</footer>
    </div>

</body>
</html>
